[package]
name = "zk-tx-submitter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["full"]}
redis = { version = "0.32.7", features = ["tokio-comp"] }
sqlx = { version = "0.8.6", features = [ "runtime-tokio", "postgres", "uuid", "chrono", "json" ] }
anchor-client = "0.31.1" # Match your program version
anchor-lang = "0.31.1"   # Match your program version
solana-sdk = "1.18.22"   # Match bonsol-sdk version
solana-client = "1.18.22" # Match bonsol-sdk version  
solana-cli-config = "1.18.22" # Match bonsol-sdk version
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
bincode = {version = "2.0.1", features = ["serde"]}
uuid = { version = "1.18.1", features = ["v4", "serde"] }
dotenvy = "0.15.7"
bs58 = "0.5.1" # For decoding secret keys if needed
hex = "0.4.3" # For image ID conversion
thiserror = "2.0.17" # For error handling
chrono = "0.4.42" # For timestamp handling if needed from DB
bonsol-sdk = "0.1.1"

# --- Bonsol Interface (needed for types and building instructions) ---
bonsol-interface = { git = "https://github.com/anagrambuild/bonsol", branch = "main" }
