[package]
name = "zk-tx-submitter"
version = "0.1.0"
edition = "2021"

[package.metadata.zkprogram]
input_order = ["Public"]  

[dependencies]
tokio = { version = "1.48.0", features = ["full"]}
redis = { version = "0.32.7", features = ["tokio-comp"] }
anchor-client = "0.31.1"
anchor-lang = "0.31.1"
solana-sdk = "2.1.0"
solana-client = "2.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
bincode = "1.3"
dotenvy = "0.15.7"
hex = "0.4.3"
thiserror = "2.0.17"
sha2 = "0.10.8"
bonsol-sdk = "0.6.1"
bonsol-interface = "0.6.1"

